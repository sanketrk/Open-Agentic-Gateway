apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-agentic-gateway
  labels:
    app.kubernetes.io/name: open-agentic-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: open-agentic-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-agentic-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: open-agentic-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: proxy
              containerPort: 8000
              protocol: TCP
            - name: status
              containerPort: 8100
              protocol: TCP
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /etc/kong/kong.yml
            - name: KONG_ADMIN_LISTEN
              value: "off"
            - name: KONG_PROXY_LISTEN
              value: 0.0.0.0:8000
            - name: KONG_STATUS_LISTEN
              value: 0.0.0.0:8100
            - name: KONG_PREFIX
              value: /tmp/kong
            - name: KONG_PLUGINS
              value: bundled,mcp,a2a,token-exchange
            - name: KONG_NGINX_HTTP_INCLUDE
              value: /etc/kong/nginx-extra.conf
            - name: KONG_NGINX_PROXY_PROXY_IGNORE_CLIENT_ABORT
              value: "off"
            - name: KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE
              value: 10m
            - name: KONG_LUA_SSL_TRUSTED_CERTIFICATE
              value: /etc/ssl/certs/ca-certificates.crt
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: kong-config
              mountPath: /etc/kong
              readOnly: true
            - name: kong-prefix
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /status
              port: status
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /status
              port: status
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /status
              port: status
            periodSeconds: 20
            timeoutSeconds: 3
      volumes:
        - name: kong-config
          configMap:
            name: open-agentic-gateway-kong
        - name: kong-prefix
          emptyDir:
            sizeLimit: 256Mi
