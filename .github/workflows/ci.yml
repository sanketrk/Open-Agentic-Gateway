name: Validate Open Agentic Gateway

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.0
      - name: Validate repository configuration
        run: |
          python3 -m pip install -r apps/control-plane/requirements.txt
          PYTHONPATH=apps/control-plane python3 -m unittest discover -s tests/control-plane -v
          PYTHONPATH=apps/control-plane:tests/control-plane python3 -c 'import json; from app import generate, validate; from test_app import sample; open("tests/generated-kong.json", "w").write(json.dumps(generate([validate(sample())], "https://mcp.example.com")))'
          PYTHONPATH=apps/control-plane:tests/control-plane python3 - <<'PY'
          import json
          from app import generate, validate
          from test_app import sample, sample_agent
          config = generate([validate(sample()), validate(sample_agent())], "https://mcp.example.com")
          config["services"][0]["routes"][0]["plugins"].append({"name": "token-exchange", "config": {
              "token_endpoint": "https://sts.example.com/token", "gateway_audience": "https://mcp.example.com/mcp/server-a",
              "resource": "https://backend.example.com/mcp", "client_id": "gateway-client",
              "client_secret_file": "/var/run/secrets/token-exchange/client-secret", "scopes": ["tools:read"]}})
          with open("tests/exchange-kong.json", "w") as output: json.dump(config, output)
          PY
          PYTHONPATH=apps/control-plane python3 -c 'import json; from app import generate; open("tests/empty-kong.json", "w").write(json.dumps(generate([], "https://mcp.example.com")))'
          node --check apps/control-plane/static/app.js
          sh -n tests/smoke.sh
          ruby tests/validate-config.rb
          ruby tests/validate-a2a.rb
          ruby tests/validate-banking.rb
          python3 -m pip install -e sdk/python
          python3 -m unittest discover -s sdk/python/tests -v
          PYTHONPATH=tests/streaming python3 -m unittest discover -s tests/streaming -p test_fixture.py -v
          PYTHONPATH=examples/banking/infrastructure:examples/banking/transaction-review-agent:examples/banking/accounts-mcp-server:examples/banking/transactions-mcp-server python3 -m unittest discover -s tests/banking -v
          ruby -ryaml -rjson - <<'RUBY'
          gateway = YAML.load_file("gateway/config/kong.yml")
          agents = YAML.load_file("examples/gateway/a2a.yml")
          route = agents["services"][0]["routes"][0]
          route["plugins"][0]["config"]["public_card"] = false
          gateway["services"].concat(agents["services"])
          File.write("tests/runtime-kong.json", JSON.generate(gateway))
          route["plugins"] << {"name" => "token-exchange", "config" => {
            "token_endpoint" => "https://sts.example.com/token",
            "gateway_audience" => route["plugins"][0]["config"]["audience"],
            "resource" => "urn:backend:agent:a", "client_id" => "gateway-client",
            "client_secret_file" => "/var/run/secrets/token-exchange/client-secret", "scopes" => ["a2a:access"]}}
          File.write("tests/a2a-exchange-kong.json", JSON.generate(agents))
          RUBY
          kubectl kustomize deploy/openshift/gateway > /tmp/open-agentic-gateway-rendered.yaml
          ruby -e 'require "yaml"; docs = YAML.load_stream(File.read("/tmp/open-agentic-gateway-rendered.yaml")); abort "unexpected rendered resource count" unless docs.length == 3'
      - name: Validate optional control plane deployment
        run: |
          kubectl kustomize deploy/openshift/control-plane > /tmp/open-agentic-control-plane-rendered.yaml
          ruby tests/validate-control-plane.rb
          docker build --tag open-agentic-control-plane:ci apps/control-plane
          docker run --rm --read-only --tmpfs /data:rw,nosuid,nodev,size=32m --env TMPDIR=/data --user 12345:0 \
            --volume "$PWD/tests/control-plane/test_app.py:/app/test_app.py:ro" \
            --volume "$PWD/tests/control-plane/test_oidc.py:/app/test_oidc.py:ro" open-agentic-control-plane:ci \
            python -m unittest -v test_app test_oidc
      - name: Build Kong OSS image
        run: docker build --build-arg KONG_VERSION=3.9.0 --tag open-agentic-gateway:ci -f gateway/Dockerfile .
      - name: Validate plugin, declarative config, and arbitrary-UID runtime
        run: |
          docker run --rm --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --user 12345:0 --volume "$PWD/tests:/tests:ro" --volume "$PWD/examples:/examples:ro" --entrypoint /bin/sh open-agentic-gateway:ci -ec '
              luajit /tests/handler_spec.lua
              luajit /tests/token_exchange_spec.lua
              luajit /tests/a2a_spec.lua
              luajit /tests/authentication_exchange_spec.lua
              kong config parse /examples/gateway/a2a.yml >/dev/null
              kong config parse /examples/banking/kong.yml >/dev/null
              kong config parse /tests/exchange-kong.json >/dev/null
              kong config parse /tests/a2a-exchange-kong.json >/dev/null
              kong config parse /etc/kong/kong.yml >/dev/null
              kong config parse /tests/generated-kong.json >/dev/null
              kong config parse /tests/empty-kong.json >/dev/null
              kong config parse /tests/runtime-kong.json >/dev/null
              kong prepare
            '
      - name: Start image with restricted filesystem and arbitrary UID
        run: |
          docker run --detach --name open-agentic-gateway-scc-test --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m --user 12345:0 \
            --volume "$PWD/tests/runtime-kong.json:/etc/kong/kong.yml:ro" \
            --publish 127.0.0.1:18100:8100 --publish 127.0.0.1:18000:8000 open-agentic-gateway:ci
          trap 'docker rm -f open-agentic-gateway-scc-test >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18100/status >/dev/null; then
              python3 tests/routing.py
              python3 tests/a2a_routing.py
              exit 0
            fi
            sleep 2
          done
          docker logs open-agentic-gateway-scc-test
          exit 1
      - name: Exercise banking examples with real token exchange
        env:
          BANKING_GATEWAY_IMAGE: open-agentic-gateway:ci
        run: |
          docker compose -f examples/banking/compose.yml build prepare banking-orchestrator review-agent accounts transactions
          trap 'docker compose -f examples/banking/compose.yml down -v >/dev/null 2>&1 || true' EXIT
          docker compose -f examples/banking/compose.yml run --rm prepare
          docker compose -f examples/banking/compose.yml up -d --wait --wait-timeout 120 issuer review-agent accounts transactions gateway
          docker compose -f examples/banking/compose.yml run --rm banking-orchestrator all
          docker compose -f examples/banking/compose.yml run --rm --entrypoint python \
            --env BANKING_INTEGRATION=1 --volume "$PWD/tests/banking/test_end_to_end.py:/demo/test_end_to_end.py:ro" \
            banking-orchestrator -m unittest -v test_end_to_end
      - name: Exercise gateway streaming independently of banking examples
        timeout-minutes: 5
        env:
          STREAMING_GATEWAY_IMAGE: open-agentic-gateway:ci
        run: |
          docker compose -f tests/streaming/compose.yml build prepare fixture tests
          trap 'docker compose -f tests/streaming/compose.yml logs --no-color; docker compose -f tests/streaming/compose.yml down -v' EXIT
          docker compose -f tests/streaming/compose.yml run --rm prepare
          docker compose -f tests/streaming/compose.yml up -d --wait --wait-timeout 120 fixture gateway
          docker compose -f tests/streaming/compose.yml run --rm tests
